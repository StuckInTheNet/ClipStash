name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ClipStash-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: ClipStash-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ClipStash-windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }}

      # macOS: zip the .app bundle
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/macos
          zip -r ${{ github.workspace }}/${{ matrix.artifact }}.zip ClipStash.app

      # Windows: zip the .exe
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName "${{ matrix.artifact }}.exe"
          } else {
            $msi = Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($msi) {
              Copy-Item $msi.FullName "${{ matrix.artifact }}.msi"
            } else {
              Copy-Item "src-tauri/target/${{ matrix.target }}/release/clipstash.exe" "${{ matrix.artifact }}.exe"
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.exe
            ${{ matrix.artifact }}.msi
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f 2>/dev/null; ls -la artifacts/ 2>/dev/null || ls -la .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            *.zip
            *.exe
            *.msi
          generate_release_notes: true
